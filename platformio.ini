; PlatformIO project configuration for the DIY Weather Clock (ESP-01S / ESP8266).
; Lets you build / flash / monitor from VSCode without the Arduino IDE.
; Equivalent to Arduino IDE "Generic ESP8266 Module" + the Adafruit libraries.

[platformio]
; The sketch (.ino) lives in the repo root, not in a src/ folder.
src_dir = .

[env:esp01_1m]
platform = espressif8266
board = esp01_1m          ; ESP-01S = 1 MB flash; use "esp01" if yours is the old 512 KB model
framework = arduino

; Flash layout: FS:none. This firmware uses no SPIFFS/LittleFS, so we reclaim the
; 256 KB the default esp01_1m layout reserves for a filesystem and give it to the
; program area. That roughly doubles the per-image space available for OTA updates
; (~500 KB/image instead of ~380 KB), which is what makes /update usable as the
; firmware grows. EEPROM (used for config) lives in its own dedicated sector and is
; unaffected. Arduino IDE equivalent: Flash Size = "1MB (FS:none OTA:~502KB)".
board_build.ldscript = eagle.flash.1m.ld

; Serial monitor (matches the firmware's Serial.begin(115200))
monitor_speed = 115200

; Flashing speed; lower this to 57600 if uploads fail on a flaky adapter
upload_speed = 115200
; upload_port = COM3      ; uncomment + set if PlatformIO doesn't auto-detect the adapter

; Libraries are downloaded automatically on first build
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    ; Netatmo JSON is parsed by hand in netatmo.h (no ArduinoJson) to stay under the 1 MB OTA ceiling.
